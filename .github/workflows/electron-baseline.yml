name: Electron baseline

# Reports the remaining upstream support window of the pinned Electron major and
# fails once it is out of support. See docs/architecture/decisions/0001-electron-44-baseline.md

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  support-window:
    name: Electron support window
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Report remaining support window
        run: node ./scripts/check-electron-eol.mjs
