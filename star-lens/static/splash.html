<html>
  <head>
    <style>
      html, body{
        width: 100%;
        height: 100%;
        overflow: hidden;
        margin: 0;
        padding: 0;
      }
      body {
        background: #1e2124;
        color: #6c757d;
        font-family: Arial, Helvetica, sans-serif;
      }
      .aligner-center-center{
        height: 100%;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .aligner-content{
        position: relative;
        width: 100%;
        padding: 80px;
      }
      .icon {
        position: relative;
        font-size: 36px;
        line-height: 54px;
        margin-bottom: 10px;
        text-align: center;
      }
      .icon svg{
        position: relative;
        display: inline-block;
        width: 54px;
        height: 54px;
        top: 14px;
      }
      .icon .icon-text{
        color: #fff;
        text-align: center;
        display: inline;
      }
      svg{
        position: relative;
        width: 100%;
      }
      .loading{
        padding-top: 10px;
        position: relative;
      }
      .bar{
        position: relative;;
        height: 2px;
        background: #262b2f;
      }
      .progress{
        position: relative;
        height: 2px;
        background: #6CC3F0;
        box-shadow: 0 0 20px #6CC3F0;
        animation-name: loader-animation;
        animation-duration: 1.6s;
        animation-iteration-count: infinite;
        animation-timing-function: ease-in-out;
      }

    @keyframes loader-animation{
      0% {
        left: 0;
        width: 0px;
      }
      50% {
        left: 0;
        width: 100%;
      }
      100% {
        left: 100%;
        width: 0px;
      }
    }
    .glow-wrapper{
      position: relative;
      width: 100%;
      height: 2px;
      top: -2px;
    }

    .glow{
      height: 100%;
      display: flex;
      transform: translateZ(0);
    }

    .glow div{
      flex: 1;
      background: #3d90ce;
      animation: glow 0.8s infinite alternate ease;
      box-shadow: 0 0 20px #3d90ce;
    }

    .glow div.b1{ animation-delay: -0.72s; }
    .glow div.b2{ animation-delay: -0.64s; }
    .glow div.b3{ animation-delay: -0.56s; }
    .glow div.b4{ animation-delay: -0.48s; }
    .glow div.b5{ animation-delay: -0.40s; }
    .glow div.b6{ animation-delay: -0.32s; }
    .glow div.b7{ animation-delay: -0.24s; }
    .glow div.b8{ animation-delay: -0.16s; }
    .glow div.b9{ animation-delay: -0.08s; }


    @keyframes glow{
      100% {
        background: transparent;
        flex: 10;
        box-shadow: 0 0 0 transparent;
      }
    }

    .text{
      height: 20px;
      line-height: 20px;
      text-align: center;
      margin-top: 5px;
    }

    </style>
  </head>
  <body>
    <div class="aligner-center-center">
      <div class="aligner-content">
        <div class="icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
            <defs>
              <linearGradient id="starlens-mark" x1="0" y1="0" x2="0.85" y2="1">
                <stop offset="0" stop-color="#C9EDFE"/>
                <stop offset="0.55" stop-color="#7FC8F0"/>
                <stop offset="1" stop-color="#4EA5DF"/>
              </linearGradient>
            </defs>
            <g fill="url(#starlens-mark)">
            <path d="M 256,256 L 237.38,198.68 Q 239.82,134.07 256,10 Z"/>
            <path d="M 256,256 L 274.62,198.68 Q 272.18,134.07 256,10 Z"/>
            <path d="M 256,256 L 313.32,237.38 Q 377.93,239.82 502,256 Z"/>
            <path d="M 256,256 L 313.32,274.62 Q 377.93,272.18 502,256 Z"/>
            <path d="M 256,256 L 274.62,313.32 Q 272.18,377.93 256,502 Z"/>
            <path d="M 256,256 L 237.38,313.32 Q 239.82,377.93 256,502 Z"/>
            <path d="M 256,256 L 198.68,274.62 Q 134.07,272.18 10,256 Z"/>
            <path d="M 256,256 L 198.68,237.38 Q 134.07,239.82 10,256 Z"/>
            <path d="M 256,256 L 275.28,221.23 Q 304.38,194.69 356.41,155.59 Z"/>
            <path d="M 256,256 L 290.77,236.72 Q 317.31,207.62 356.41,155.59 Z"/>
            <path d="M 256,256 L 290.77,275.28 Q 317.31,304.38 356.41,356.41 Z"/>
            <path d="M 256,256 L 275.28,290.77 Q 304.38,317.31 356.41,356.41 Z"/>
            <path d="M 256,256 L 236.72,290.77 Q 207.62,317.31 155.59,356.41 Z"/>
            <path d="M 256,256 L 221.23,275.28 Q 194.69,304.38 155.59,356.41 Z"/>
            <path d="M 256,256 L 221.23,236.72 Q 194.69,207.62 155.59,155.59 Z"/>
            <path d="M 256,256 L 236.72,221.23 Q 207.62,194.69 155.59,155.59 Z"/>
            <path d="M 462.39,299.87 A 211,211 0 0 1 299.87,462.39 L 298.62,456.52 A 205,205 0 0 0 456.52,298.62 Z"/>
            <path d="M 212.13,462.39 A 211,211 0 0 1 49.61,299.87 L 55.48,298.62 A 205,205 0 0 0 213.38,456.52 Z"/>
            <path d="M 49.61,212.13 A 211,211 0 0 1 212.13,49.61 L 213.38,55.48 A 205,205 0 0 0 55.48,213.38 Z"/>
            <path d="M 299.87,49.61 A 211,211 0 0 1 462.39,212.13 L 456.52,213.38 A 205,205 0 0 0 298.62,55.48 Z"/>
            <path fill-rule="evenodd" d="M 223,256 a 33,33 0 1,0 66,0 a 33,33 0 1,0 -66,0 Z M 240,256 a 16,16 0 1,1 32,0 a 16,16 0 1,1 -32,0 Z"/>
            </g>
          </svg>
          <div class="icon-text">StarLens</div>
        </div>
        <div class="loading">
          <div class="bar">
            <div class="progress"></div>
          </div>
          <div class="glow-wrapper">
            <div class="glow">
              <div class="b1"></div>
              <div class="b2"></div>
              <div class="b3"></div>
              <div class="b4"></div>
              <div class="b5"></div>
              <div class="b6"></div>
              <div class="b7"></div>
              <div class="b8"></div>
              <div class="b9"></div>
            </div>
          </div>
          <div class="text">
            Loading...
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
